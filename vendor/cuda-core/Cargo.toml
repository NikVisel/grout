[package]
name = "cuda-core"
description = "Idiomatic CUDA API."
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Melih Elibol"]
repository = "https://github.com/nvlabs/cutile-rs"
readme = "README.md"

[dependencies]
cuda-bindings = { git = "https://github.com/NVlabs/cutile-rs.git", rev = "e04245bdcf1f5bfc602a2078168eff90ee40bebb" }
cuda-core-derive = { git = "https://github.com/NVlabs/cutile-rs.git", rev = "e04245bdcf1f5bfc602a2078168eff90ee40bebb", version = "=0.4.0" }
anyhow = "1"
half = "2"
oxide-artifacts = { version = "0.2.1", features = ["object-read"] }

[dev-dependencies]
trybuild = "1"

[features]
# Nightly-only: DeviceCopy for the unstable f16 primitive.
f16 = []

