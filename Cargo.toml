[package]
name = "grout"
version = "0.1.0"
edition = "2024"
default-run = "grout"
autobins = false

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
memmap2 = "0.9.10"
rand = "0.8.5"
rayon = "1.11.0"
safetensors = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tokenizers = "0.20.4"
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }

cudarc = { version = "0.19.2", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "dynamic-loading", "cuda-13010"] }

cuda-bindings = { git = "https://github.com/NVlabs/cutile-rs.git", rev = "e04245bdcf1f5bfc602a2078168eff90ee40bebb" }
cuda-core = { git = "https://github.com/NVlabs/cutile-rs.git", rev = "e04245bdcf1f5bfc602a2078168eff90ee40bebb" }
cuda-async = { git = "https://github.com/NVlabs/cutile-rs.git", rev = "e04245bdcf1f5bfc602a2078168eff90ee40bebb" }
cutile-compiler = { git = "https://github.com/NVlabs/cutile-rs.git", rev = "e04245bdcf1f5bfc602a2078168eff90ee40bebb" }
cutile = { git = "https://github.com/NVlabs/cutile-rs.git", rev = "e04245bdcf1f5bfc602a2078168eff90ee40bebb" }

[patch."https://github.com/NVlabs/cutile-rs.git"]
cuda-core = { path = "vendor/cuda-core" }

[features]
benchmarks = []
native-training = ["dep:candle-core", "dep:candle-nn"]

[[bin]]
name = "grout_train"
path = "src/bin/grout_train.rs"
required-features = ["native-training"]

[[bin]]
name = "grout"
path = "src/main.rs"

[[bin]]
name = "grout_quantize"
path = "src/bin/grout_quantize.rs"

[[bin]]
name = "grout_quant_probe"
path = "src/bin/grout_quant_probe.rs"

[[bin]]
name = "grout_bench"
path = "benchmarks/src/bin/grout_bench.rs"
required-features = ["benchmarks"]

[[bin]]
name = "attention_microbench"
path = "benchmarks/src/bin/attention_microbench.rs"
required-features = ["benchmarks"]

[[bin]]
name = "gemv_microbench"
path = "benchmarks/src/bin/gemv_microbench.rs"
required-features = ["benchmarks"]

[[bin]]
name = "group_gemm_microbench"
path = "benchmarks/src/bin/group_gemm_microbench.rs"
required-features = ["benchmarks"]
